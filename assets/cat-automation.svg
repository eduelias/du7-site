<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Automation and assistants">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1410"/>
      <stop offset="1" stop-color="#17301F"/>
    </linearGradient>
    <style>
      .t { font: 700 84px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .s { font: 600 34px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9FD8B6; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bgA)"/>

  <!-- motif: chat bubbles + a check, echoing the assistant flow -->
  <g transform="translate(806,52)" stroke="#4ADE80" stroke-width="4" fill="none">
    <rect x="0" y="0" rx="14" width="150" height="58"/>
    <path d="M26 58 l0 20 l22 -20" stroke-linejoin="round"/>
    <g fill="#4ADE80" stroke="none">
      <circle cx="36" cy="29" r="6"/><circle cx="66" cy="29" r="6"/><circle cx="96" cy="29" r="6"/>
    </g>
    <rect x="86" y="96" rx="14" width="170" height="58" stroke-opacity="0.5"/>
    <path d="M232 154 l0 20 l-22 -20" stroke-opacity="0.5" stroke-linejoin="round"/>
    <path d="M120 125 l16 16 l30 -34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text class="t" x="56" y="146">Automation</text>
  <text class="s" x="60" y="198">&amp; assistants</text>
  <rect x="60" y="228" width="190" height="6" rx="3" fill="#4ADE80"/>
</svg>
