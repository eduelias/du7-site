<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Developer tools">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1410"/>
      <stop offset="1" stop-color="#1B2A18"/>
    </linearGradient>
    <style>
      .t { font: 700 84px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .s { font: 600 34px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9FD8B6; }
      .c { font: 700 44px ui-monospace, 'SF Mono', Menlo, monospace; fill: #4ADE80; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bgD)"/>

  <!-- motif: a terminal window with a prompt -->
  <g transform="translate(838,52)">
    <rect x="0" y="0" rx="12" width="256" height="184" fill="none" stroke="#4ADE80" stroke-width="4"/>
    <path d="M0 46 H256" stroke="#4ADE80" stroke-width="3" stroke-opacity="0.5"/>
    <g fill="#4ADE80" fill-opacity="0.75">
      <circle cx="26" cy="23" r="7"/><circle cx="52" cy="23" r="7"/><circle cx="78" cy="23" r="7"/>
    </g>
    <path d="M30 92 l30 26 l-30 26" stroke="#4ADE80" stroke-width="6" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="80" y="136" width="94" height="8" rx="4" fill="#4ADE80" fill-opacity="0.85"/>
  </g>

  <text class="t" x="56" y="146">Developer</text>
  <text class="s" x="60" y="198">tools</text>
  <rect x="60" y="228" width="190" height="6" rx="3" fill="#4ADE80"/>
</svg>
