<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IoT and edge">
  <defs>
    <linearGradient id="bgI" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0C1410"/>
      <stop offset="1" stop-color="#142C2B"/>
    </linearGradient>
    <style>
      .t { font: 700 84px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .s { font: 600 34px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9FD8B6; }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bgI)"/>

  <!-- motif: a chip with traces radiating to edge nodes -->
  <g transform="translate(816,44)" stroke="#4ADE80" stroke-width="4" fill="none">
    <g stroke-opacity="0.45">
      <path d="M130 98 L40 40"/><path d="M130 98 L232 40"/>
      <path d="M130 98 L38 160"/><path d="M130 98 L234 160"/>
    </g>
    <rect x="96" y="64" rx="10" width="68" height="68"/>
    <g stroke-opacity="0.8">
      <path d="M112 64 v-16"/><path d="M148 64 v-16"/>
      <path d="M112 132 v16"/><path d="M148 132 v16"/>
      <path d="M96 82 h-16"/><path d="M96 114 h-16"/>
      <path d="M164 82 h16"/><path d="M164 114 h16"/>
    </g>
    <g fill="#4ADE80" stroke="none">
      <circle cx="40" cy="40" r="8"/><circle cx="232" cy="40" r="8"/>
      <circle cx="38" cy="160" r="8"/><circle cx="234" cy="160" r="8"/>
      <rect x="120" y="88" width="20" height="20" rx="4"/>
    </g>
  </g>

  <text class="t" x="56" y="146">IoT</text>
  <text class="s" x="60" y="198">&amp; edge</text>
  <rect x="60" y="228" width="190" height="6" rx="3" fill="#4ADE80"/>
</svg>
