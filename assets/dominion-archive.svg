<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dominion Archive promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text class="kicker" x="56" y="80">COLLECTION MANAGER · FAN PROJECT</text>

  <!-- decorative: a fanned stack of cards and a box -->
  <g transform="translate(920,30)" stroke="#4ADE80" stroke-width="2.5" fill="#0D1712">
    <rect x="0" y="40" rx="8" width="92" height="130" transform="rotate(-12 46 105)" stroke-opacity="0.35"/>
    <rect x="30" y="30" rx="8" width="92" height="130" transform="rotate(-4 76 95)" stroke-opacity="0.6"/>
    <rect x="60" y="22" rx="8" width="92" height="130" transform="rotate(5 106 87)"/>
    <rect x="76" y="40" width="60" height="16" rx="4" fill="#4ADE80" stroke="none" transform="rotate(5 106 87)"/>
    <rect x="150" y="100" rx="6" width="90" height="70" stroke-opacity="0.7"/>
    <path d="M150 118 h90" stroke-opacity="0.7"/>
  </g>

  <text class="title" x="52" y="165">Dominion Archive</text>

  <text class="sub" x="56" y="225">Every set and card, your own boxes,</text>
  <text class="sub" x="56" y="268">and tonight's kingdom in one tap.</text>

  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Catalogue with ratings and a public Game Night randomizer</text>
  <text class="bullet" x="92" y="415">Your printings, the box each pile sits in, a pull list per game</text>
  <text class="bullet" x="92" y="469">Passkey accounts · invite friends to rate alongside you</text>

  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">dom.du7.dev</text>
  <text class="footr" x="1144" y="588" text-anchor="end">unofficial · Dominion is a trademark of Rio Grande Games</text>
</svg>
