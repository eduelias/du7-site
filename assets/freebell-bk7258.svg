<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="freebell-bk7258 promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- kicker -->
  <text class="kicker" x="56" y="80">OPEN FIRMWARE · VIDEO DOORBELL</text>

  <!-- decorative: the doorbell (camera lens, PIR window, button ring) with signal arcs, top-right -->
  <g transform="translate(962,34)" stroke="#4ADE80" fill="none" stroke-width="2.5">
    <rect x="34" y="0" width="92" height="176" rx="40" fill="#0D1712"/>
    <circle cx="80" cy="44" r="18"/>
    <circle cx="80" cy="44" r="7" fill="#4ADE80" stroke="none"/>
    <rect x="66" y="78" width="28" height="12" rx="6" stroke-opacity="0.6"/>
    <circle cx="80" cy="132" r="24"/>
    <circle cx="80" cy="132" r="13" stroke-opacity="0.6"/>
    <g stroke-opacity="0.5">
      <path d="M150 112 a28 28 0 0 1 0 40"/>
      <path d="M164 98 a46 46 0 0 1 0 68"/>
      <path d="M10 112 a28 28 0 0 0 0 40"/>
      <path d="M-4 98 a46 46 0 0 0 0 68"/>
    </g>
  </g>

  <!-- title -->
  <text class="title" x="52" y="165">freebell-bk7258</text>

  <!-- subtitle -->
  <text class="sub" x="56" y="225">A Tuya doorbell that could never be paired —</text>
  <text class="sub" x="56" y="268">now fully local, on Home Assistant.</text>

  <!-- bullets -->
  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Own firmware on the Beken BK7258: no cloud, no app</text>
  <text class="bullet" x="92" y="415">RTSP video · two-way audio with echo cancelling · PIR</text>
  <text class="bullet" x="92" y="469">Deep sleep on battery · OTA updates with a rescue mode</text>

  <!-- footer -->
  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">Rescued from e-waste</text>
  <text class="footr" x="1144" y="588" text-anchor="end">Apache-2.0 · github.com/eduelias/freebell-bk7258</text>
</svg>
