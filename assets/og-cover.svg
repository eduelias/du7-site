<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Du7 Technology Services — rrbot.nl, Pauta and open-source tools, built and run by one engineer in the Netherlands">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .mark    { font: 700 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 8px; }
      .title   { font: 700 76px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .tagline { font: 400 30px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .cat     { font: 700 19px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 2.5px; }
      .proj    { font: 400 23px ui-monospace, 'SF Mono', Menlo, monospace; fill: #E8F0EB; }
      .note    { font: 400 20px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footl   { font: 700 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr   { font: 400 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- header -->
  <text class="mark" x="60" y="78">DU7.DEV</text>
  <text class="title" x="56" y="162">Du7 Technology Services</text>
  <text class="tagline" x="60" y="214">A WhatsApp trip log, a request queue for ad teams,</text>
  <text class="tagline" x="60" y="254">and a shelf of open-source tools. One engineer, Netherlands.</text>

  <line x1="60" y1="300" x2="1140" y2="300" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- three columns: products, open source, blog -->
  <g>
    <text class="cat"  x="60" y="352">PRODUCTS</text>
    <text class="proj" x="60" y="398">rrbot.nl</text>
    <text class="proj" x="60" y="436">pauta.cc</text>
    <text class="proj" x="60" y="474">dom.du7.dev</text>
  </g>
  <g>
    <text class="cat"  x="440" y="352">OPEN SOURCE</text>
    <text class="proj" x="440" y="398">famulus</text>
    <text class="proj" x="440" y="436">rittenregistratie-bot</text>
    <text class="proj" x="440" y="474">greengrass-ipc · freebell</text>
  </g>
  <g>
    <text class="cat"  x="860" y="352">ENGINEERING BLOG</text>
    <text class="proj" x="860" y="398">blog.du7.dev</text>
    <text class="note" x="860" y="436">Chasing a 5% ghost: when a</text>
    <text class="note" x="860" y="466">good result lies</text>
  </g>

  <!-- accent underlines per column -->
  <g stroke="#4ADE80" stroke-width="3" stroke-opacity="0.55">
    <path d="M60 368 H300"/>
    <path d="M440 368 H680"/>
    <path d="M860 368 H1100"/>
  </g>

  <!-- footer -->
  <line x1="60" y1="530" x2="1140" y2="530" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>
  <text class="footl" x="60" y="580">Self-hosted · open source · Netherlands</text>
  <text class="footr" x="1140" y="580" text-anchor="end">info@du7.dev · KVK 91476003</text>
</svg>
