<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pauta promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text class="kicker" x="56" y="80">REQUEST QUEUE FOR SMALL ADS TEAMS · BRAZIL</text>

  <!-- decorative: a three-column board with cards -->
  <g transform="translate(900,36)" stroke="#4ADE80" stroke-width="2.5" fill="none">
    <g stroke-opacity="0.5">
      <rect x="0" y="0" rx="8" width="72" height="150"/>
      <rect x="86" y="0" rx="8" width="72" height="150"/>
      <rect x="172" y="0" rx="8" width="72" height="150"/>
    </g>
    <g fill="#4ADE80" stroke="none">
      <rect x="10" y="12" rx="4" width="52" height="24"/>
      <rect x="10" y="44" rx="4" width="52" height="24" opacity="0.55"/>
      <rect x="10" y="76" rx="4" width="52" height="24" opacity="0.3"/>
      <rect x="96" y="12" rx="4" width="52" height="24"/>
      <rect x="96" y="44" rx="4" width="52" height="24" opacity="0.55"/>
      <rect x="182" y="12" rx="4" width="52" height="24"/>
    </g>
  </g>

  <text class="title" x="52" y="165">Pauta</text>

  <text class="sub" x="56" y="225">A fila de pedidos do seu time de marketing.</text>
  <text class="sub" x="56" y="268">Every client's requests and campaigns, in one place.</text>

  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Briefing, budget, deadline and board, organised by client</text>
  <text class="bullet" x="92" y="415">Meta ads numbers and ad-balance alerts, read-only</text>
  <text class="bullet" x="92" y="469">Sign in with Face ID or fingerprint · one flat price per team</text>

  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">Closed beta · www.pauta.cc</text>
  <text class="footr" x="1144" y="588" text-anchor="end">web app · Brazilian Portuguese</text>
</svg>
