<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="rrbot.nl promotional banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E0C"/>
      <stop offset="0.55" stop-color="#0D1712"/>
      <stop offset="1" stop-color="#16281F"/>
    </linearGradient>
    <style>
      .kicker { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #4ADE80; letter-spacing: 4px; }
      .title  { font: 700 72px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .sub    { font: 600 32px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #CFE3D8; }
      .bullet { font: 400 26px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #E8F0EB; }
      .footl  { font: 700 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FAE9E; }
      .footr  { font: 400 22px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7E8F87; }
      .chat   { font: 600 22px ui-monospace, 'SF Mono', Menlo, monospace; fill: #0A0E0C; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <text class="kicker" x="56" y="80">WHATSAPP TRIP LOG · NETHERLANDS</text>

  <!-- decorative: one sent message, one thumbs-up reply -->
  <g transform="translate(900,36)">
    <rect x="0" y="0" rx="14" width="244" height="50" fill="#4ADE80"/>
    <path d="M226 50 l14 18 l-26 -18" fill="#4ADE80"/>
    <text class="chat" x="22" y="33">45230 Kantoor</text>
    <rect x="150" y="92" rx="14" width="94" height="50" fill="#0D1712" stroke="#4ADE80" stroke-width="2.5"/>
    <path d="M168 142 l-14 18 l26 -18" fill="#0D1712" stroke="#4ADE80" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- thumbs-up glyph -->
    <g transform="translate(182,102)" stroke="#4ADE80" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M8 14 h-6 v14 h6 z"/>
      <path d="M8 15 l8 -12 c3 -3 7 0 6 4 l-2 7 h9 c3 0 4 2 4 4 l-3 10 c-1 2 -2 3 -4 3 h-18 z"/>
    </g>
  </g>

  <text class="title" x="52" y="165">rrbot.nl</text>

  <text class="sub" x="56" y="225">Je rittenregistratie, gewoon via WhatsApp.</text>
  <text class="sub" x="56" y="268">One message per trip; the Excel the Belastingdienst asks for.</text>

  <g fill="#4ADE80">
    <circle cx="66" cy="352" r="7"/>
    <circle cx="66" cy="406" r="7"/>
    <circle cx="66" cy="460" r="7"/>
  </g>
  <text class="bullet" x="92" y="361">Send the odometer reading and destination, get a thumbs-up back</text>
  <text class="bullet" x="92" y="415">Per-year Excel with the fields the Belastingdienst asks per trip</text>
  <text class="bullet" x="92" y="469">14 days free, then a monthly subscription, cancel any month</text>

  <line x1="56" y1="540" x2="1144" y2="540" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>
  <text class="footl" x="56" y="588">A service of Du7 Technology Services</text>
  <text class="footr" x="1144" y="588" text-anchor="end">open-source core · MIT</text>
</svg>
