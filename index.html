<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Du7 Technology Services</title>
  <meta name="description" content="Du7 Technology Services — pragmatic engineering for infrastructure, cloud, and automation.">
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #111823;
      --text: #e6edf3;
      --muted: #8b98a5;
      --accent: #4cc2ff;
      --border: #1e2a38;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    main {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .mark {
      font-size: 0.85rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: clamp(1.9rem, 5vw, 2.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    .tagline {
      font-size: 1.1rem;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 2.5rem;
    }
    .card p { color: var(--muted); line-height: 1.7; }
    .contact a {
      display: inline-block;
      color: var(--bg);
      background: var(--accent);
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      transition: opacity 0.15s ease;
    }
    .contact a:hover { opacity: 0.85; }
    footer {
      margin-top: 3.5rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">du7.dev</div>
    <h1>Du7 Technology Services</h1>
    <p class="tagline">Pragmatic engineering for infrastructure, cloud, and automation.</p>
    <div class="card">
      <p>Our full site is on the way. In the meantime, get in touch — we're happy to talk about your project.</p>
    </div>
    <div class="contact">
      <a href="mailto:hello@du7.dev">hello@du7.dev</a>
    </div>
    <footer>&copy; 2026 Du7 Technology Services</footer>
  </main>
</body>
</html>
